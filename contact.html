<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Doctor Communication</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app-container">

<div class="app-shell">

<aside class="sidebar">

<div class="sidebar-top"></div>

<div class="sidebar-menu">

<a href="index.html" class="nav-item">
<span class="nav-icon" aria-hidden="true">▦</span>
<span>Dashboard</span>
</a>

<a href="doctor.html" class="nav-item">
<span class="nav-icon" aria-hidden="true">✚</span>
<span>Doctor</span>
</a>

<a href="contact.html" class="nav-item active">
<span class="nav-icon" aria-hidden="true">●●</span>
<span>Contact</span>
</a>

<a href="tracker.html" class="nav-item">
<span class="nav-icon" aria-hidden="true">⌁</span>
<span>Tracker</span>
</a>

</div>

<div class="sidebar-bottom"></div>

</aside>

<div class="contact-page">

<h1>Communication with your doctor</h1>

<div class="contact-layout">

<div class="contacts-panel card">

<h2>Your Contacts</h2>

<div class="contact-user active-contact">
<h4>Dr. Taylor Morgan</h4>
<p>Surgeon</p>
</div>

<div class="contact-user">
<h4>Dr. Jordan Lee</h4>
<p>Immunologist</p>
</div>

<div class="contact-user">
<h4>Case Coordinator</h4>
<p>Osaka</p>
</div>

</div>

<div class="chat-panel card">

<div class="chat-header">

<h3>Dr. Taylor Morgan</h3>

<div>
<span aria-hidden="true">☎</span>
<span aria-hidden="true">⌕</span>
</div>

</div>

<div class="chat-area">

<div class="message incoming">
When vision becomes cloudy...
</div>

<div class="message outgoing">
Thank you doctor.
</div>

</div>

<div class="chat-input">

<input
type="text"
placeholder="Write your message">

<button>
<span aria-hidden="true">➤</span>
</button>

</div>

</div>

</div>

</div>

</div>

</div>

</body>
