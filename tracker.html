<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Meal Tracker</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app-container">

<div class="app-shell">

<aside class="sidebar">

<div class="sidebar-top"></div>

<div class="sidebar-menu">

<a href="index.html" class="nav-item">
<span class="nav-icon" aria-hidden="true">▦</span>
<span>Dashboard</span>
</a>

<a href="doctor.html" class="nav-item">
<span class="nav-icon" aria-hidden="true">✚</span>
<span>Doctor</span>
</a>

<a href="contact.html" class="nav-item">
<span class="nav-icon" aria-hidden="true">●●</span>
<span>Contact</span>
</a>

<a href="tracker.html" class="nav-item active">
<span class="nav-icon" aria-hidden="true">⌁</span>
<span>Tracker</span>
</a>

</div>

<div class="sidebar-bottom"></div>

</aside>

<div class="tracker-page">

<h1>Track your meals and order food</h1>

<div class="tracker-layout">

<div class="categories card">

<h2>Categories</h2>

<div class="category-grid">

<button>Veggies</button>
<button>Fruits</button>
<button>Beverages</button>
<button>Baking</button>

</div>

</div>

<div class="order-panel card">

<h2>Your Order</h2>

<ul>

<li>🍓 Strawberry <span>$25.50</span></li>

<li>🧀 Cheddar <span>$16.00</span></li>

<li>🍕 Pizza Margarita <span>$5.00</span></li>

</ul>

<div class="total-price">

<span>Total</span>
<strong>$46.50</strong>

</div>

<button class="appointment-btn">
MAKE AN ORDER
</button>

</div>

<div class="tracker-summary card">

<h2>Progress</h2>

<div class="progress-circle">
320 kcal left
</div>

<div class="nutrition-grid">

<div>
<h4>Carbs</h4>
<p>24g left</p>
</div>

<div>
<h4>Protein</h4>
<p>56g left</p>
</div>

<div>
<h4>Fat</h4>
<p>16g left</p>
</div>

</div>

</div>

</div>

</div>

</div>

</div>

</body>
</html>
