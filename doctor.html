<h1>Opportunity to make an appointment</h1>

<div class="doctor-layout">

<h2>Your Treatment</h2>

<div class="treatment-card">
<h3>Dr. Taylor Morgan</h3>
<p>Surgeon</p>
<p>26 Aug 2019</p>
</div>

<div class="treatment-card">
<h3>Dr. Leonard Vasquez</h3>
<p>Therapist</p>
<p>26 Aug 2019</p>
</div>

</div>

<div class="appointment-panel card">

<h2>Your Doctor</h2>

<div class="doctor-profile">

<img src="assets/clinician-avatar.svg">

<div>
<h3>Dr. Eula Harris</h3>
<p>Therapist</p>
</div>

</div>

<div class="appointment-grid">

<div>
<label>Appointed Day</label>
<input type="date">
</div>

<div>
<label>Appointed Time</label>
<input type="time">
</div>

</div>

<h2>Your Data</h2>

<div class="patient-data">

<div><strong>Blood</strong><span>-B</span></div>
<div><strong>Height</strong><span>170 cm</span></div>
<div><strong>Weight</strong><span>60 kg</span></div>

</div>

<div class="disease-box">

<input
type="text"
placeholder="Write your disease">

<button>
Don't know
</button>

</div>

<button class="appointment-btn">
MAKE AN APPOINTMENT
</button>

</div>

</div>

</div>

</div>
